<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema CAC - Coordinador</title>
  <link rel="stylesheet" href="vendor/tailwind.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F1F4F9; margin: 0; padding-top: 34px; }
    .titlebar-drag {
      position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 200;
      background: #0D1F3A; -webkit-app-region: drag;
      display: flex; align-items: center; gap: 8px; padding: 0 12px;
      color: #C7D2E3; font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    }
    .titlebar-drag img { -webkit-app-region: no-drag; pointer-events: none; }
    .card { background: white; border-radius: 1.25rem; box-shadow: 0 2px 16px rgba(0,0,0,0.07); }
    .fade-in { animation: fi 0.3s ease; }
    @keyframes fi { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    .btn-green  { background: linear-gradient(135deg, #1B5E20, #2E7D32); }
    .btn-navy   { background: linear-gradient(135deg, #122B4F, #1565C0); }
    .btn-red    { background: #C41E3A; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

    /* ── Layout: sidebar + contenido ───────────────────────── */
    /* Fijo al viewport (no sticky): position:sticky no se recalcula bien en
       Electron/Chromium al redimensionar la ventana y deja un hueco vacío. */
    .app-shell { min-height: calc(100vh - 34px); }
    .sidebar {
      width: 244px;
      background: linear-gradient(180deg, #2B0D14 0%, #4A1220 55%, #6b1a2e 100%);
      display: flex; flex-direction: column;
      position: fixed; top: 34px; left: 0; bottom: 0;
    }
    .sidebar-nav-scroll { flex: 1; min-height: 0; overflow-y: auto; }
    .sidebar-nav-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-nav-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
    .app-main { margin-left: 244px; padding: 28px 32px 40px; }

    .nav-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 16px; margin: 2px 12px; border-radius: 10px;
      font-size: 13px; font-weight: 600; color: #D9A9B4;
      cursor: pointer; transition: all 0.15s; user-select: none;
      border: 1px solid transparent;
    }
    .nav-item:hover { background: rgba(255,255,255,0.06); color: white; }
    .nav-item.active { background: rgba(255,255,255,0.12); color: white; border-color: rgba(255,255,255,0.15); }
    .nav-item .nav-accent { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; background: currentColor; opacity: .55; }
    .nav-item.active .nav-accent { opacity: 1; }
    .nav-group-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      color: #B57E8C; padding: 18px 22px 6px;
    }
    .sidebar-header { padding: 28px 20px 22px; }
    .sidebar-footer {
      padding: 22px 20px 30px;
      border-top: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .sidebar-footer > * + * { margin-top: 14px; }

    /* ── Campana de alertas ────────────────────────────────── */
    .alertas-btn {
      width: 44px; height: 44px; border-radius: 14px; border: none; cursor: pointer;
      position: relative; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0F1E38, #234B85);
      box-shadow: 0 3px 12px rgba(15, 30, 56, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .alertas-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(15, 30, 56, 0.35); }
    .alertas-btn:active { transform: translateY(0); }
    .alertas-btn.ringing svg { animation: bell-ring 0.7s ease-in-out; transform-origin: 50% 15%; }
    @keyframes bell-ring {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(16deg); }
      30% { transform: rotate(-13deg); }
      45% { transform: rotate(9deg); }
      60% { transform: rotate(-6deg); }
      75% { transform: rotate(3deg); }
    }
    .alertas-badge { position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; }
    .alertas-badge-ping {
      position: absolute; inset: 0; border-radius: 999px; background: #EF4444;
      animation: alertas-ping 1.8s cubic-bezier(0,0,0.2,1) infinite;
    }
    @keyframes alertas-ping {
      0% { transform: scale(0.9); opacity: 0.75; }
      75%, 100% { transform: scale(2.1); opacity: 0; }
    }
    .alertas-badge-dot {
      position: absolute; inset: 0; border-radius: 999px; background: #EF4444; color: #fff;
      font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center;
      border: 2px solid #F1F4F9;
    }
    .alertas-panel {
      position: absolute; right: 0; top: 52px; width: 380px; max-height: 26rem; overflow-y: auto;
      background: white; border-radius: 1rem; box-shadow: 0 16px 40px rgba(15,23,42,0.18);
      border: 1px solid rgba(15,23,42,0.06); z-index: 40;
      animation: alertas-panel-in 0.16s ease;
    }
    @keyframes alertas-panel-in {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body class="min-h-screen">

  <div class="titlebar-drag">
    <img src="img/icon.ico" width="16" height="16" alt="">
    <span>CAC Insepet</span>
  </div>

  <div class="app-shell">

    <!-- ══════════════════════ SIDEBAR ══════════════════════ -->
    <aside class="sidebar">
      <div class="sidebar-header flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:#C41E3A">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </div>
        <div>
          <div class="font-black text-white text-base tracking-[0.18em] leading-none">INSEPET</div>
          <div class="text-xs tracking-widest" style="color:#E8B8C4">COORDINADOR</div>
        </div>
      </div>

      <div class="sidebar-nav-scroll">
        <div class="nav-group-label">Gestión</div>
        <nav id="sidebar-nav"></nav>
      </div>

      <div class="nav-item" style="margin:2px 12px 10px" onclick="abrirTiempoMuerto('tabContenido')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="2" y="6" width="20" height="12" rx="4"/><circle cx="8" cy="12" r="1.5" fill="currentColor" stroke="none"/>
          <circle cx="16" cy="10.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="13.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        Tiempo muerto
      </div>

      <div class="sidebar-footer">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-xs font-semibold tracking-widest uppercase" style="color:#E8B8C4">Coordinador</div>
            <div id="coordNombre" class="text-white font-bold text-sm"></div>
          </div>
          <button onclick="cerrarSesion()" title="Salir"
            class="w-9 h-9 flex items-center justify-center rounded-xl text-white hover:bg-white hover:bg-opacity-10 transition border border-white border-opacity-20 flex-shrink-0">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- ══════════════════════ CONTENIDO ══════════════════════ -->
    <main class="app-main fade-in">
      <div class="flex justify-end mb-3 relative">
        <button id="alertasBtn" onclick="toggleAlertasPanel()" class="alertas-btn">
          <svg id="alertasBell" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="alertasBadge" hidden class="alertas-badge">
            <span class="alertas-badge-ping"></span>
            <span id="alertasBadgeDot" class="alertas-badge-dot"></span>
          </span>
        </button>
        <div id="alertasPanel" hidden class="alertas-panel">
          <div class="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between" style="background:linear-gradient(135deg,#0F1E38,#1B3A66)">
            <span class="text-sm font-bold text-white tracking-wide">Alertas · Cola 3CX</span>
          </div>
          <div id="alertasLista"></div>
        </div>
      </div>
      <div class="card overflow-hidden">
        <div id="tabContenido" class="p-7 min-h-64">
          <div class="flex flex-col items-center justify-center py-14 text-gray-300">
            <p class="text-sm font-medium text-gray-600">Selecciona una sección</p>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script src="config.js"></script>
  <script src="server-monitor.js"></script>
  <script src="socket.io.min.js"></script>
  <script src="coordinador.js"></script>
  <script src="juegos.js"></script>

</body>
</html>
