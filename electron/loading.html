<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CAC Insepet</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0D1F3A 0%, #122B4F 60%, #1a3a6b 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden; user-select: none;
    }

    /* Fondo con rayas sutiles */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: repeating-linear-gradient(
        -55deg,
        transparent 0px, transparent 18px,
        rgba(255,255,255,0.018) 18px, rgba(255,255,255,0.018) 36px
      );
      pointer-events: none;
    }

    /* Entrada suave */
    .contenedor {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 36px;
      animation: entrada 0.7s ease;
    }
    @keyframes entrada {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    /* Logo */
    .logo-box {
      width: 80px; height: 80px; border-radius: 22px;
      background: #C41E3A;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 40px rgba(196, 30, 58, 0.4);
    }

    .app-name {
      font-size: 24px; font-weight: 900; color: white;
      letter-spacing: 0.2em; text-align: center;
    }
    .app-sub {
      font-size: 11px; color: #93C5FD;
      letter-spacing: 0.28em; text-align: center; margin-top: 4px;
    }

    /* ── Estado: cargando ── */
    #estado-cargando {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* Spinner doble anillo */
    .spinner-wrap {
      position: relative; width: 48px; height: 48px;
    }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid transparent;
      animation: girar 1s linear infinite;
    }
    .ring-outer { border-top-color: #C41E3A; animation-duration: 0.9s; }
    .ring-inner {
      inset: 8px;
      border-bottom-color: rgba(21, 101, 192, 0.7);
      animation-direction: reverse;
      animation-duration: 1.2s;
    }
    @keyframes girar { to { transform: rotate(360deg); } }

    .estado-texto {
      font-size: 13px; font-weight: 500; color: #93C5FD;
      letter-spacing: 0.04em; min-height: 20px; text-align: center;
      transition: opacity 0.3s;
    }

    /* Barra de progreso */
    .progress-track {
      width: 220px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.1); overflow: hidden;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #C41E3A 0%, #1565C0 100%);
      border-radius: 2px;
      transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Estado: error ── */
    #estado-error {
      display: none; flex-direction: column; align-items: center; gap: 14px;
      animation: entrada 0.4s ease;
    }

    .error-icon-wrap {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(239, 68, 68, 0.12);
      display: flex; align-items: center; justify-content: center;
    }

    .error-titulo {
      font-size: 15px; font-weight: 700; color: white; text-align: center;
    }
    .error-sub {
      font-size: 12px; color: #64748B; text-align: center; margin-top: -6px;
    }
    .error-api {
      font-size: 11.5px; color: #475569; text-align: center;
      font-family: monospace; background: rgba(255,255,255,0.06);
      padding: 5px 14px; border-radius: 6px;
    }

    .btn-retry {
      margin-top: 4px; padding: 10px 32px;
      background: #C41E3A; color: white;
      border: none; border-radius: 10px;
      font-size: 13.5px; font-weight: 700; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn-retry:hover  { background: #A01530; }
    .btn-retry:active { transform: scale(0.97); }

    /* Version tag */
    .version {
      position: fixed; bottom: 18px; left: 0; right: 0;
      text-align: center; font-size: 11px; color: #334155;
    }
  </style>
</head>
<body>

  <div class="contenedor">

    <!-- Logo + nombre -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="logo-box">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <div>
        <div class="app-name">INSEPET</div>
        <div class="app-sub">SISTEMA CAC</div>
      </div>
    </div>

    <!-- Estado: cargando -->
    <div id="estado-cargando">
      <div class="spinner-wrap">
        <div class="ring ring-outer"></div>
        <div class="ring ring-inner"></div>
      </div>
      <div class="estado-texto" id="estado-texto">Iniciando sistema…</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Estado: error de conexión -->
    <div id="estado-error">
      <div class="error-icon-wrap">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="error-titulo">No se pudo conectar con el servidor</div>
      <div class="error-sub">Verifica que el servidor esté encendido y en la misma red</div>
      <div class="error-api" id="error-api"></div>
      <button class="btn-retry" onclick="iniciarCarga()">Reintentar</button>
    </div>

  </div>

  <div class="version">CAC INSEPET v1.0.0</div>

  <script src="config.js"></script>
  <script>
    const MAX_INTENTOS = 3;
    const TIMEOUT_MS   = 7000;

    function delay(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    function setTexto(txt) {
      const el = document.getElementById('estado-texto');
      el.style.opacity = '0';
      setTimeout(() => { el.textContent = txt; el.style.opacity = '1'; }, 150);
    }

    function setProgress(pct) {
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    function mostrarError() {
      document.getElementById('estado-cargando').style.display = 'none';
      document.getElementById('estado-error').style.display    = 'flex';
      document.getElementById('error-api').textContent = API;
    }

    function mostrarCargando() {
      document.getElementById('estado-error').style.display    = 'none';
      document.getElementById('estado-cargando').style.display = 'flex';
    }

    async function intentarConectar() {
      const ctrl  = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      try {
        const res = await fetch(`${API}/health`, { signal: ctrl.signal });
        clearTimeout(timer);
        return res.ok;
      } catch (e) {
        clearTimeout(timer);
        return false;
      }
    }

    async function iniciarCarga() {
      mostrarCargando();
      setProgress(0);
      setTexto('Iniciando sistema…');
      await delay(450);

      setProgress(25);
      setTexto('Verificando conexión con el servidor…');

      let conectado = false;
      for (let i = 0; i < MAX_INTENTOS; i++) {
        conectado = await intentarConectar();
        if (conectado) break;
        if (i < MAX_INTENTOS - 1) {
          setTexto(`Sin respuesta, reintentando… (${i + 2}/${MAX_INTENTOS})`);
          await delay(1500);
        }
      }

      if (!conectado) {
        mostrarError();
        return;
      }

      setProgress(70);
      setTexto('Cargando componentes…');
      await delay(500);

      setProgress(92);
      setTexto('¡Sistema listo!');
      await delay(380);

      setProgress(100);
      await delay(180);

      window.location.href = 'index.html';
    }

    iniciarCarga();
  </script>

</body>
</html>
